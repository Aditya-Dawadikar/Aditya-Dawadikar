<svg xmlns="http://www.w3.org/2000/svg" width="410" height="240" viewBox="0 0 410 240" role="img" aria-label="Contribution streak: current 1 days, longest 15 days, 2,356 total contributions since 2019."><title>Contribution streak: current 1 days, longest 15 days, 2,356 total contributions since 2019.</title><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient><clipPath id="frame"><rect x="0.5" y="0.5" width="409" height="239" rx="10"/></clipPath></defs><style>
svg{fill:#e6edf3}
text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.muted{fill:#8b949e}
.faint{fill:#3b4452}
.cyan{fill:#22d3ee}
.purple{fill:#a78bfa}
.accent{fill:url(#accent)}
